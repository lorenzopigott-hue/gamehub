<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Blaster</title>

<style>
body {
  margin: 0;
  background: #080b18;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 15px 0 5px;
}

p {
  color: #c4ccff;
}

#info {
  font-size: 19px;
  margin: 10px;
}

canvas {
  display: block;
  margin: auto;
  max-width: 96%;
  background: #03050d;
  border: 3px solid #536dff;
  border-radius: 10px;
}

button {
  padding: 11px 18px;
  margin: 8px;
  border: none;
  border-radius: 8px;
  background: #536dff;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#upgradeBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.card {
  background: #151a35;
  border: 2px solid #6677ff;
  border-radius: 14px;
  padding: 22px;
  width: min(500px, 90vw);
}

.card button {
  display: block;
  width: 100%;
  margin: 10px 0;
}
</style>
</head>

<body>

<h1>🚀 Space Blaster</h1>

<p>
A/D or ←/→ to move • SPACE to shoot
</p>

<div id="info">
Stage: <span id="stage">1</span> |
Score: <span id="score">0</span> |
Lives: <span id="lives">3</span> |
Boss HP: <span id="bossHP">--</span>
</div>

<canvas id="game" width="800" height="500"></canvas>

<button onclick="startGame()">Restart Game</button>

<div id="upgradeBox">

  <div class="card">

    <h2>⭐ Choose Your Stage 2 Upgrade!</h2>

    <p>Pick ONE upgrade:</p>

    <button onclick="chooseUpgrade('rapid')">
      ⚡ Rapid Fire
    </button>

    <button onclick="chooseUpgrade('power')">
      💥 Power Shot
    </button>

    <button onclick="chooseUpgrade('triple')">
      🔱 Triple Shot
    </button>

  </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const stageText = document.getElementById("stage");
const bossHPText = document.getElementById("bossHP");
const upgradeBox = document.getElementById("upgradeBox");

const keys = {};

let player;
let bullets;
let enemies;
let enemyBullets;
let boss;

let score;
let lives;
let stage;
let upgrade;

let gameOver;
let gameMode;

let lastShot;
let enemyMove;
let enemyDirection;
let enemyShootTimer;


/* CONTROLS */

document.addEventListener("keydown", function(event) {

  keys[event.key.toLowerCase()] = true;

  if (event.code === "Space") {

    event.preventDefault();

    if (gameMode === "playing") {
      shoot();
    }

  }

});


document.addEventListener("keyup", function(event) {

  keys[event.key.toLowerCase()] = false;

});


/* START */

function startGame() {

  player = {
    x: 370,
    y: 440,
    width: 60,
    height: 25,
    speed: 7
  };

  bullets = [];
  enemies = [];
  enemyBullets = [];

  boss = null;

  score = 0;
  lives = 3;
  stage = 1;

  upgrade = null;

  gameOver = false;
  gameMode = "playing";

  lastShot = 0;

  enemyMove = 0;
  enemyDirection = 1;
  enemyShootTimer = 0;

  upgradeBox.style.display = "none";

  createEnemies(27);

  updateUI();

  requestAnimationFrame(gameLoop);
}


/* CREATE ENEMIES */

function createEnemies(amount) {

  enemies = [];

  let columns;

  if (stage === 1) {
    columns = 9;
  } else {
    columns = 12;
  }

  for (let i = 0; i < amount; i++) {

    let column = i % columns;
    let row = Math.floor(i / columns);

    enemies.push({

      x: 45 + column * 60,

      y: 55 + row * 48,

      width: 36,

      height: 25,

      alive: true

    });

  }

}


/* UPGRADE */

function chooseUpgrade(type) {

  upgrade = type;

  upgradeBox.style.display = "none";

  stage = 2;

  gameMode = "playing";

  bullets = [];

  enemyBullets = [];

  boss = null;

  enemyMove = 0;

  enemyDirection = 1;

  enemyShootTimer = 0;

  createEnemies(48);

  updateUI();

  requestAnimationFrame(gameLoop);

}


/* SHOOT */

function shoot() {

  let now = performance.now();

  let fireDelay = 220;

  if (upgrade === "rapid") {
    fireDelay = 100;
  }

  if (now - lastShot < fireDelay) {
    return;
  }

  lastShot = now;


  /* TRIPLE SHOT */

  if (upgrade === "triple") {

    bullets.push({

      x: player.x + 27,
      y: player.y - 15,

      width: 6,
      height: 14,

      speed: 10,

      damage: 1

    });


    bullets.push({

      x: player.x + 12,
      y: player.y - 10,

      width: 6,
      height: 14,

      speed: 10,

      damage: 1

    });


    bullets.push({

      x: player.x + 42,
      y: player.y - 10,

      width: 6,
      height: 14,

      speed: 10,

      damage: 1

    });

    return;
  }


  /* NORMAL / POWER SHOT */

  bullets.push({

    x: player.x + 27,

    y: player.y - 15,

    width: 6,

    height: 14,

    speed: 10,

    damage: upgrade === "power" ? 2 : 1

  });

}


/* COLLISION */

function collision(a, b) {

  return (

    a.x < b.x + b.width &&

    a.x + a.width > b.x &&

    a.y < b.y + b.height &&

    a.y + a.height > b.y

  );

}


/* UI */

function updateUI() {

  scoreText.textContent = score;

  livesText.textContent = lives;

  stageText.textContent = stage;

  if (boss) {

    bossHPText.textContent =
      boss.health + " / " + boss.maxHealth;

  } else {

    bossHPText.textContent = "--";

  }

}


/* LOSE LIFE */

function loseLife() {

  lives--;

  updateUI();

  if (lives <= 0) {

    gameOver = true;

    gameMode = "gameover";

  }

}


/* UPDATE */

function update() {

  if (gameMode !== "playing") {
    return;
  }


  /* PLAYER */

  if (keys["arrowleft"] || keys["a"]) {
    player.x -= player.speed;
  }

  if (keys["arrowright"] || keys["d"]) {
    player.x += player.speed;
  }


  if (player.x < 5) {
    player.x = 5;
  }

  if (player.x > canvas.width - player.width - 5) {
    player.x =
      canvas.width - player.width - 5;
  }


  /* PLAYER BULLETS */

  for (let i = bullets.length - 1; i >= 0; i--) {

    bullets[i].y -= bullets[i].speed;

    if (bullets[i].y < -30) {

      bullets.splice(i, 1);

    }

  }


  /* BOSS */

  if (boss) {

    updateBoss();

  }


  /* ENEMY MOVEMENT */

  if (!boss) {

    enemyMove++;

    if (enemyMove > 18) {

      enemyMove = 0;

      let edge = false;

      for (const enemy of enemies) {

        if (!enemy.alive) continue;

        enemy.x += enemyDirection * 3;

        if (
          enemy.x < 10 ||
          enemy.x + enemy.width > 790
        ) {

          edge = true;

        }

      }


      if (edge) {

        enemyDirection *= -1;

        for (const enemy of enemies) {

          if (enemy.alive) {
            enemy.y += 12;
          }

        }

      }

    }

  }


  /* ENEMY SHOOTING */

  enemyShootTimer++;

  if (enemyShootTimer > 40) {

    enemyShootTimer = 0;

    let aliveEnemies =
      enemies.filter(enemy => enemy.alive);

    if (aliveEnemies.length > 0) {

      let enemy =
        aliveEnemies[
          Math.floor(
            Math.random() *
            aliveEnemies.length
          )
        ];


      enemyBullets.push({

        x: enemy.x + enemy.width / 2,

        y: enemy.y + enemy.height,

        width: 7,

        height: 14,

        speed: stage === 2 ? 5 : 4

      });

    }

  }


  /* ENEMY BULLETS */

  for (
    let i = enemyBullets.length - 1;
    i >= 0;
    i--
  ) {

    let bullet = enemyBullets[i];

    bullet.y += bullet.speed;


    if (collision(bullet, player)) {

      enemyBullets.splice(i, 1);

      loseLife();

      continue;

    }


    if (bullet.y > 520) {

      enemyBullets.splice(i, 1);

    }

  }


  /* PLAYER BULLETS */

  for (
    let i = bullets.length - 1;
    i >= 0;
    i--
  ) {

    let bullet = bullets[i];


    /* BOSS HIT */

    if (boss && collision(bullet, boss)) {

      boss.health -= bullet.damage;

      score += 5;

      bullets.splice(i, 1);

      updateUI();


      if (boss.health <= 0) {

        defeatBoss();

      }

      continue;

    }


    /* LITTLE ENEMY HIT */

    for (const enemy of enemies) {

      if (
        enemy.alive &&
        collision(bullet, enemy)
      ) {

        enemy.alive = false;

        score += 10;

        bullets.splice(i, 1);

        break;

      }

    }

  }


  /* CHECK IF ALL ENEMIES ARE DEAD */

  if (
    !boss &&
    enemies.length > 0 &&
    enemies.every(enemy => !enemy.alive)
  ) {

    createBoss();

  }

}


/* CREATE BOSS */

function createBoss() {

  if (stage === 1) {

    boss = {

      x: 290,

      y: 50,

      width: 220,

      height: 90,

      health: 30,

      maxHealth: 30,

      speed: 3,

      direction: 1,

      timer: 0

    };

  } else {

    boss = {

      x: 260,

      y: 45,

      width: 280,

      height: 105,

      health: 55,

      maxHealth: 55,

      speed: 4,

      direction: 1,

      timer: 0

    };

  }

  bullets = [];

  enemyBullets = [];

  updateUI();

}


/* BOSS UPDATE */

function updateBoss() {

  boss.x +=
    boss.speed *
    boss.direction;


  if (
    boss.x < 10 ||
    boss.x + boss.width > 790
  ) {

    boss.direction *= -1;

  }


  boss.timer++;


  let attackSpeed =
    stage === 1 ? 40 : 25;


  if (boss.timer > attackSpeed) {

    boss.timer = 0;


    let numberOfShots =
      stage === 1 ? 2 : 3;


    for (
      let i = 0;
      i < numberOfShots;
      i++
    ) {

      let shotX =
        boss.x +
        35 +
        i *
        (
          (boss.width - 70) /
          (numberOfShots - 1)
        );


      enemyBullets.push({

        x: shotX,

        y: boss.y + boss.height,

        width: 9,

        height: 18,

        speed: stage === 2 ? 6 : 5

      });

    }

  }

}


/* BOSS DEFEATED */

function defeatBoss() {

  if (stage === 1) {

    score += 500;

    boss = null;

    gameMode = "upgrade";

    stage = 2;

    updateUI();

    upgradeBox.style.display = "flex";

  }

  else {

    score += 1000;

    gameOver = true;

    gameMode = "win";

    updateUI();

  }

}


/* DRAW */

function draw() {

  /* BACKGROUND */

  ctx.fillStyle = "#03050d";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* STARS */

  ctx.fillStyle = "white";

  for (let i = 0; i < 90; i++) {

    let x =
      (i * 97) %
      canvas.width;

    let y =
      (i * 53) %
      canvas.height;

    ctx.fillRect(
      x,
      y,
      2,
      2
    );

  }


  /* PLAYER */

  ctx.fillStyle = "#35e7ff";

  ctx.beginPath();

  ctx.moveTo(
    player.x + 30,
    player.y - 12
  );

  ctx.lineTo(
    player.x,
    player.y + 25
  );

  ctx.lineTo(
    player.x + 60,
    player.y + 25
  );

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle = "white";

  ctx.fillRect(
    player.x + 25,
    player.y + 5,
    10,
    10
  );


  /* PLAYER BULLETS */

  ctx.fillStyle = "#ffe66d";

  for (const bullet of bullets) {

    ctx.fillRect(
      bullet.x,
      bullet.y,
      bullet.width,
      bullet.height
    );

  }


  /* LITTLE ENEMIES */

  for (const enemy of enemies) {

    if (!enemy.alive) continue;


    ctx.fillStyle =
      stage === 1
      ? "#ff4d8d"
      : "#35ff9b";


    ctx.fillRect(
      enemy.x,
      enemy.y,
      enemy.width,
      enemy.height
    );


    ctx.fillStyle = "#111";


    ctx.fillRect(
      enemy.x + 7,
      enemy.y + 6,
      6,
      6
    );


    ctx.fillRect(
      enemy.x + 23,
      enemy.y + 6,
      6,
      6
    );

  }


  /* BOSS */

  if (boss) {

    ctx.fillStyle =
      stage === 1
      ? "#9b30ff"
      : "#e639ff";


    ctx.fillRect(
      boss.x,
      boss.y,
      boss.width,
      boss.height
    );


    /* WINGS */

    ctx.fillStyle = "#ff304f";


    ctx.fillRect(
      boss.x - 35,
      boss.y + 25,
      35,
      45
    );


    ctx.fillRect(
      boss.x + boss.width,
      boss.y + 25,
      35,
      45
    );


    /* EYES */

    ctx.fillStyle = "#ffe600";


    ctx.fillRect(
      boss.x + 45,
      boss.y + 25,
      35,
      20
    );


    ctx.fillRect(
      boss.x + boss.width - 80,
      boss.y + 25,
      35,
      20
    );


    /* HEALTH BAR */

    ctx.fillStyle = "#333";

    ctx.fillRect(
      boss.x,
      boss.y - 18,
      boss.width,
      10
    );


    ctx.fillStyle = "#ff304f";

    ctx.fillRect(
      boss.x,
      boss.y - 18,
      boss.width *
      (boss.health / boss.maxHealth),
      10
    );

  }


  /* ENEMY BULLETS */

  ctx.fillStyle = "#ff9f43";

  for (const bullet of enemyBullets) {

    ctx.fillRect(
      bullet.x,
      bullet.y,
      bullet.width,
      bullet.height
    );

  }


  /* END SCREEN */

  if (
    gameMode === "win" ||
    gameMode === "gameover"
  ) {

    ctx.fillStyle =
      "rgba(0,0,0,.75)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.textAlign = "center";

    ctx.fillStyle = "white";

    ctx.font =
      "bold 40px Arial";


    if (gameMode === "win") {

      ctx.fillText(
        "🏆 YOU BEAT STAGE 2!",
        400,
        230
      );

    } else {

      ctx.fillText(
        "GAME OVER",
        400,
        230
      );

    }


    ctx.font =
      "22px Arial";


    ctx.fillText(
      "Score: " + score,
      400,
      275
    );


    ctx.textAlign = "left";

  }

}


/* GAME LOOP */

function gameLoop() {

  update();

  draw();

  if (!gameOver) {

    requestAnimationFrame(gameLoop);

  }

}


startGame();

</script>

</body>
</html>
